name: Label PR with Areas

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read # minimum permission to checkout the repo such that .areas can be parsed.

jobs:
  label-pr:
    runs-on: ubuntu-latest
    environment: pr-workflows
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # The action only needs access to the .areas configuration,
          # but the workflows in this repo use the compiled action directly, so it also needs dist/index.js
          sparse-checkout: |
            .areas
            dist/index.js

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.CODE_AREAS_APP_ID }}
          private-key: ${{ secrets.CODE_AREAS_PEM }}

      - name: Label PR
        uses: ./
        with:
          token: ${{ steps.generate-token.outputs.token }}
          command: label-pr
