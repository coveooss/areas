name: Label PR with Areas

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read # minimum permission to checkout the repo such that .areas can be parsed.

jobs:
  label-pr:
    runs-on: ubuntu-latest
    environment: pr-workflows
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The action only needs access to the .areas configuration,
          # but the workflows in this repo use the compiled action directly, so it also needs dist/index.js
          sparse-checkout: |
            .areas
            dist/index.js

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.CODE_AREAS_APP_ID }}
          private-key: ${{ secrets.CODE_AREAS_PEM }}

      - name: Label PR
        uses: ./
        with:
          token: ${{ steps.generate-token.outputs.token }}
          command: label-pr
