name: Update Area Rulesets

on:
  push:
    branches:
      - main
    paths:
      - '.areas/**'
      - '.github/workflows/areas-ruleset-sync.yml'
      - 'action.yml'
      - 'dist/index.js'

permissions:
  contents: read # minimum permission to checkout the repo such that .areas can be parsed.

jobs:
  manage-areas:
    runs-on: ubuntu-latest
    environment: push-to-main-workflows
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The action only needs access to the .areas configuration,
          # but the workflows in this repo use the compiled action directly, so it also needs dist/index.js
          sparse-checkout: |
            .areas
            dist/index.js

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.CODE_AREAS_APP_ID }}
          private-key: ${{ secrets.CODE_AREAS_PEM }}

      - name: Sync Area Rulesets
        uses: ./
        with:
          token: ${{ steps.generate-token.outputs.token }}
          command: ruleset-sync
