name: Update Area Rulesets

on:
  push:
    branches:
      - main
    paths:
      - '.areas/**'
      - '.github/workflows/areas-ruleset-sync.yml'
      - 'action.yml'
      - 'dist/index.js'

permissions:
  contents: read # minimum permission to checkout the repo such that .areas can be parsed.

jobs:
  manage-areas:
    runs-on: ubuntu-latest
    environment: push-to-main-workflows
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # The action only needs access to the .areas configuration,
          # but the workflows in this repo use the compiled action directly, so it also needs dist/index.js
          sparse-checkout: |
            .areas
            dist/index.js

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: ${{ vars.CODE_AREAS_APP_ID }}
          private-key: ${{ secrets.CODE_AREAS_PEM }}

      - name: Sync Area Rulesets
        uses: ./
        with:
          token: ${{ steps.generate-token.outputs.token }}
          command: ruleset-sync
