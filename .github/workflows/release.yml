name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0 - https://github.com/coveo-platform/gha-infra
        with:
          title: 'chore: release'
          commit: 'chore: release'
          version: pnpm changeset version
          publish: pnpm changeset tag
          createGithubReleases: true
          commitMode: github-api
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update major version tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          set -euo pipefail

          VERSION=$(jq -r '.version' package.json)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          git tag -fa "v$MAJOR" -m "Update v$MAJOR tag to v$VERSION"
          git push origin "v$MAJOR" --force

          echo "Updated v$MAJOR tag to point to v$VERSION"
