name: Build action
on:
  push:
    branches: [main]
  pull_request: ~

permissions:
  contents: read

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild the action
        run: pnpm run build

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain dist/index.js)" ]; then
            echo "Error: dist/index.js is out of sync. Please run 'pnpm run build' and commit the changes."
            git status --porcelain dist/index.js
            exit 1
          else
            echo "dist/index.js is up-to-date."
          fi
