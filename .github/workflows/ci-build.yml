name: Build action
on:
  push:
    branches: [main]
  pull_request: ~

permissions:
  contents: read

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild the action
        run: pnpm run build

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain dist/index.js)" ]; then
            echo "Error: dist/index.js is out of sync. Please run 'pnpm run build' and commit the changes."
            git status --porcelain dist/index.js
            exit 1
          else
            echo "dist/index.js is up-to-date."
          fi
